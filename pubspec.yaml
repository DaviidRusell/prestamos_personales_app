name: info_credito_app
description: App informativa de comparación de créditos personales en Colombia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.6
  flutter_native_splash: ^2.4.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icono.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
flutter_native_splash:
  color: "#062B66"
  image: assets/icono.png
  fullscreen: true
  android_12:
    color: "#062B66"
    image: assets/icono.png
    icon_background_color: "#062B66"


flutter:
  uses-material-design: true
